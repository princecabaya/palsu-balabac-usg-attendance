<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Burungitaw Control</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar"><div class="brand">BURUNGITAW • LAPTOP A CONTROL</div><span id="authState" class="pill">Admin sign in</span></div><main class="wrap"><section id="loginCard" class="card"><h2>Technical / Tabulator Sign In</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><p><button id="login">Sign in</button></p><div id="loginStatus" class="notice" hidden></div></section><section id="controlApp" class="hidden"><div class="grid cards"><div class="card"><h3>Master Audio</h3><p class="muted">Laptop A microphone is the only program audio source.</p><button id="startAudio">Start Microphone + Program Feed</button><div id="audioState" class="notice">Not started</div></div><div class="card"><h3>Program</h3><p>Preview: <strong id="previewName">None</strong></p><p>Program: <strong id="programName">Standby</strong></p><button id="clearGraphic" class="secondary">Clear Graphic</button></div></div><h2>Cameras</h2><div id="cameraGrid" class="camera-grid"></div><hr style="border-color:#263244;margin:26px 0"><h2>Score Reveal</h2><div class="card"><div class="grid cards"><div><label>Segment</label><select id="segment"></select></div><div><label>Category</label><select id="sex"><option value="male">Male</option><option value="female">Female</option></select></div><div><label>Candidate</label><select id="candidate"></select></div></div><div id="scoreState" class="notice">Select a candidate.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button data-reveal="1">Judge 1</button><button data-reveal="2">Judge 2</button><button data-reveal="3">Judge 3</button><button data-reveal="4">Judge 4</button><button data-reveal="5">Judge 5</button><button data-reveal="all" class="secondary">All Five</button><button data-reveal="avg" class="secondary">Average</button></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><select id="reopenJudge" style="max-width:220px"></select><button id="reopen" class="danger">Reopen Score</button></div></div><canvas id="programCanvas" width="1280" height="720" class="hidden"></canvas></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/common.js"></script><script src="assets/control.js"></script></body></html>
