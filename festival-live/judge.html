<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Burungitaw Judge</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="topbar"><div class="brand">BURUNGITAW • JUDGING</div><span id="judgeLabel" class="pill">Sign in</span></div><main class="wrap"><section id="loginCard" class="card"><h2>Judge Sign In</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><p><button id="login">Sign in</button></p><div id="loginStatus" class="notice" hidden></div></section><section id="judgeApp" class="hidden"><div class="card"><div class="grid cards"><div><label>Segment</label><select id="segment"></select></div><div><label>Category</label><select id="sex"><option value="male">Male</option><option value="female">Female</option></select></div></div></div><div class="score-grid"><aside class="card"><h3>Candidates</h3><div id="candidates" class="candidate-list"></div></aside><section class="card"><div id="candidateTitle"><h2>Select a candidate</h2></div><div id="criteria" class="criteria"></div><div class="notice" id="scoreStatus" hidden></div><div style="display:flex;gap:10px;margin-top:16px"><button id="save">Save Draft</button><button id="submit" class="danger">Submit & Lock</button></div></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/common.js"></script><script src="assets/judge.js"></script></body></html>
